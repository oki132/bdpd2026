<style>
:root{
  --ink:#0F1720; --ink2:#2E3742; --muted:#5B6470; --line:#E2DED5; --soft:#F1EEE7; --bg:#F5F3EE; --card:#FFFFFF; --gold:#E9C46A;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
a{color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hidden{display:none !important}
.wrap{max-width:1320px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:20px}

/* header */
.top{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;padding:10px 12px 10px 16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;border:none;background:none;padding:0;cursor:pointer;text-align:left}
.logo{width:36px;height:36px;border-radius:10px;background:conic-gradient(from 200deg,#E8743B,#E9C46A,#2BA47A,#3A7BD5,#D04F7E,#E8743B);flex-shrink:0}
.brand b{display:block;font-size:15px;font-weight:800}
.brand small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.tnav{display:flex;gap:4px;background:var(--soft);border-radius:12px;padding:4px}
.tnav button{min-height:40px;border:none;border-radius:9px;padding:8px 16px;font-size:14px;font-weight:700;cursor:pointer;background:transparent;display:inline-flex;align-items:center;gap:8px}
.tnav button[aria-current="page"]{background:var(--ink);color:#fff}
.bnav{display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:30;justify-content:space-around;gap:4px;background:rgba(15,23,32,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:20px;padding:8px}
.bnav button{flex:1;min-height:52px;border:none;border-radius:14px;background:transparent;color:#F5F3EE;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;cursor:pointer}
.bnav button[aria-current="page"]{background:rgba(255,255,255,.14)}
@media (max-width:760px){.tnav{display:none}.bnav{display:flex}.wrap{padding-bottom:120px}}

/* common */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:14px;padding:12px 20px;font-size:15px;font-weight:800;cursor:pointer;text-decoration:none;border:none}
.btn-dark{background:var(--ink);color:#fff}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-line{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn-ghost{background:rgba(255,255,255,.08);color:#F5F3EE;border:1.5px solid rgba(255,255,255,.4)}
.btn-white{background:#fff;color:var(--ink)}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px}
.h2{margin:0;font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.02em}
.sub{font-size:15px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.st-live{background:#D93636;color:#fff}.st-soon{background:var(--soft);color:var(--ink2)}.st-done{background:#E4E1DA;color:var(--muted)}
.lift{transition:transform .25s ease,box-shadow .25s ease}
.lift:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(15,23,32,.14)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,54,54,.6)}70%{box-shadow:0 0 0 10px rgba(217,54,54,0)}100%{box-shadow:0 0 0 0 rgba(217,54,54,0)}}
.pulse{animation:pulse 1.6s infinite}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--ink);color:#F5F3EE;border-radius:24px;padding:clamp(28px,5vw,64px)}
.blob{position:absolute;border-radius:50%;filter:blur(90px)}
@keyframes d1{0%,100%{transform:none}50%{transform:translate(60px,40px) scale(1.15)}}
@keyframes d2{0%,100%{transform:none}50%{transform:translate(-70px,-30px) scale(1.1)}}
@keyframes d3{0%,100%{transform:none}50%{transform:translate(40px,-50px)}}
.b1{width:420px;height:420px;background:#3A7BD5;opacity:.55;top:-160px;right:-60px;animation:d1 14s ease-in-out infinite}
.b2{width:360px;height:360px;background:#D04F7E;opacity:.45;bottom:-180px;right:220px;animation:d2 18s ease-in-out infinite}
.b3{width:300px;height:300px;background:#2BA47A;opacity:.4;top:40px;left:-120px;animation:d3 16s ease-in-out infinite}
.hero-in{position:relative;display:flex;flex-direction:column;gap:22px}
.pill{align-self:flex-start;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700}
.hero h1{margin:0;font-size:clamp(40px,8vw,96px);line-height:.95;font-weight:800;letter-spacing:-.03em}
.hero h1 span{background:linear-gradient(90deg,#E9C46A,#E8743B,#D04F7E);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;font-size:clamp(16px,2vw,20px);line-height:1.55;color:#C9CFD6;max-width:640px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{background:rgba(255,255,255,.08);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
.hero-foot{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px;padding-top:8px}
.cd-label{font-size:13px;font-weight:700;color:var(--gold)}
.cd{display:flex;gap:8px;margin-top:10px}
.cd span{min-width:64px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.cd b{font-size:clamp(24px,4vw,34px);font-weight:800;font-variant-numeric:tabular-nums}
.cd small{font-size:11px;font-weight:600;color:#AEB6C0}

/* marquee */
.marquee{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin-top:-16px}
@keyframes mq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.track{display:flex;width:max-content;gap:40px;animation:mq 40s linear infinite}
.track span{font-size:16px;font-weight:700;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:40px}
.track span::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold)}

/* grids */
.grid-sess{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.sess{position:relative;overflow:hidden;text-align:left;cursor:pointer;border:none;border-radius:20px;padding:22px;min-height:220px;display:flex;flex-direction:column;gap:10px;color:#fff}
.sess .big{position:absolute;right:-10px;bottom:-40px;font-size:160px;line-height:1;font-weight:800;color:rgba(255,255,255,.14)}
.sess .k{font-size:13px;font-weight:700;opacity:.9}
.sess .t{position:relative;font-size:21px;line-height:1.25;font-weight:800}
.sess .w{position:relative;margin-top:auto;align-self:flex-start;background:rgba(255,255,255,.18);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.day{text-align:left;cursor:pointer;padding:24px;display:flex;flex-direction:column;gap:16px}
.day-h{display:flex;align-items:center;justify-content:space-between;gap:12px}
.day-h b{display:block;font-size:22px;font-weight:800}
.day-h small{font-size:13px;font-weight:700;color:var(--muted)}
.day-h i{font-style:normal;font-size:48px;font-weight:800;line-height:1;color:var(--line)}
.mini{display:flex;gap:12px;align-items:center;border-radius:12px;padding:10px 12px}
.mini .bar{width:6px;align-self:stretch;border-radius:3px;flex-shrink:0}
.mini small{display:block;font-size:12px;font-weight:700}
.mini b{display:block;font-size:14px;font-weight:700;line-height:1.3}
.goals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:20px}
.goals div{display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.55}
.goals b{font-size:40px;line-height:1;font-weight:800}

/* agenda */
.page-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.page-h h1{margin:0;font-size:clamp(30px,5vw,52px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.seg{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px}
.seg button{flex:1;min-height:52px;border:none;border-radius:12px;padding:8px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:#fff;text-align:left}
.seg button b{font-size:15px;font-weight:800}
.seg button small{font-size:12px;font-weight:600;opacity:.85}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.timehead{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:800}
.timehead small{font-size:13px;font-weight:600;color:var(--muted)}
.timehead::after{content:"";flex:1;height:1px;background:var(--line)}
.slot{overflow:hidden;display:flex;flex-direction:column}
.slot .top-bar{height:8px}
.slot .in{padding:20px;display:flex;flex-direction:column;gap:12px;flex:1}
.slot h3{margin:0;font-size:21px;line-height:1.25;font-weight:800}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lbl{font-size:13px;font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600}
.acts{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px;padding-top:4px}
.acts .btn{min-height:44px;padding:10px 16px;font-size:14px;border-radius:12px}
.save[aria-pressed="true"]{background:#F7E7B5}
.break{text-align:left;cursor:pointer;border:1.5px dashed #C9C3B6;border-radius:18px;padding:18px 20px;background:#FBF9F4;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}

/* detail */
.back{align-self:flex-start;min-height:44px;border:none;background:none;font-size:15px;font-weight:700;padding:8px 0;cursor:pointer}
.dhero{position:relative;overflow:hidden;border-radius:24px;padding:clamp(24px,5vw,48px);color:#fff}
.dhero .big{position:absolute;right:-20px;bottom:-80px;font-size:clamp(200px,30vw,340px);line-height:1;font-weight:800;color:rgba(255,255,255,.12)}
.dhero .in{position:relative;display:flex;flex-direction:column;gap:14px;max-width:820px}
.dhero h1{margin:0;font-size:clamp(30px,5.5vw,58px);line-height:1.04;font-weight:800;letter-spacing:-.02em}
.dhero .chips span{background:rgba(255,255,255,.18);font-weight:700}
.split{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.split .main{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:18px}
.split .side{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:14px}
.lead{margin:0;font-size:clamp(16px,2vw,19px);line-height:1.65;color:var(--ink2);max-width:72ch}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.col{padding:18px;display:flex;flex-direction:column;gap:10px}
.col li{display:flex;gap:8px;font-size:15px;line-height:1.45}
.col ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.col li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);margin-top:8px;flex-shrink:0}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.person{display:flex;align-items:center;gap:12px;border-radius:14px;padding:10px 12px;font-size:14px;font-weight:700;line-height:1.3}
.person i{font-style:normal;width:40px;height:40px;border-radius:12px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0}
.box{padding:18px;display:flex;flex-direction:column;gap:10px}
.box h2{margin:0;font-size:16px;font-weight:800}

/* live */
.stage{position:relative;overflow:hidden;aspect-ratio:16/9;border-radius:22px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(14px,3vw,26px)}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.play{width:clamp(54px,8vw,76px);height:clamp(54px,8vw,76px);border-radius:50%;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.5);display:inline-flex;align-items:center;justify-content:center}
.panel{padding:14px;display:flex;flex-direction:column;gap:12px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--soft);border-radius:12px;padding:4px}
.tabs button{min-height:40px;border:none;border-radius:9px;padding:6px 2px;font-size:13px;font-weight:700;cursor:pointer;background:transparent}
.tabs button[aria-selected="true"]{background:#fff;box-shadow:0 1px 4px rgba(15,23,32,.12)}
.frame{width:100%;border:0;border-radius:14px;background:var(--soft)}
.empty{border:1.5px dashed #C9C3B6;border-radius:14px;background:#FBF9F4;padding:18px;font-size:14px;line-height:1.5;color:var(--muted)}
.code{font-size:28px;font-weight:800;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:14px;padding:10px 12px}

@media (prefers-reduced-motion:reduce){.b1,.b2,.b3,.track,.pulse,.rise{animation:none}.lift:hover{transform:none}}
</style>
</head>

}
function fromHash() {

          </div>
          ${has(m.vote) ? `<a class="btn btn-dark" href="${m.vote}" target="_blank" rel="noopener">Isi survei di Mentimeter</a>` : `<div class="empty">Tautan survei Sesi ${cur.num} belum dipasang. Isi <b>menti.${cur.num}.vote</b> di PENGATURAN.</div>`}
          ${has(m.code) ? `<div style="display:flex;flex-direction:column;gap:2px;background:var(--soft);border-radius:14px;padding:12px 14px"><span class="sub" style="font-size:13px">Atau buka <b>menti.com</b> dan masukkan kode</span><span class="code">${m.code}</span></div>` : ''}
          ${has(m.embed) ? `<span class="lbl" style="color:var(--muted)">Hasil live</span><div style="position:relative;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:var(--soft)"><iframe src="${m.embed}" title="Hasil survei Sesi ${cur.num}" style="position:absolute;inset:0;width:100%;height:100%;border:0" allowfullscreen loading="lazy"></iframe></div>` : ''}
        </div>

        <div id="pn-materi" role="tabpanel" aria-labelledby="tab-materi" class="${S.tab === 'materi' ? '' : 'hidden'}" style="display:flex;flex-direction:column;gap:8px">
          ${[1, 2, 3, 4, 5].map((n) => { const se = SESI[n], u = CONFIG.materi[n];
            return `<div class="list-item" style="background:${se.tint}"><span style="min-width:0"><small style="display:block;font-size:12px;font-weight:800;color:${se.dark}">Sesi ${n}</small><b style="display:block;font-size:14px;line-height:1.3">${se.name}</b></span>
              ${has(u) ? `<a class="btn btn-line" style="min-height:40px;padding:6px 12px;font-size:13px;border-radius:10px;flex-shrink:0" href="${u}" target="_blank" rel="noopener">Buka</a>` : `<span class="sub" style="font-size:12px;flex-shrink:0">Segera</span>`}</div>`; }).join('')}
        </div>

        <div id="pn-rehat" role="tabpanel" aria-labelledby="tab-rehat" class="${S.tab === 'rehat' ? '' : 'hidden'}" style="display:flex;flex-direction:column;gap:12px">
          <div style="border-radius:16px;padding:18px;color:#fff;background:linear-gradient(140deg,#E8743B,#D04F7E);display:flex;flex-direction:column;gap:6px">
            <span style="font-size:13px;font-weight:700;opacity:.9">ISHOMA, 12.00–13.30 WIB</span>
            <span style="font-size:20px;font-weight:800;line-height:1.25">Ngobrol santai dengan peserta dari kedua ruang</span>
          </div>
          ${has(CONFIG.rehat) ? `<a class="btn btn-dark" href="${CONFIG.rehat}" target="_blank" rel="noopener">Gabung ruang rehat</a>` : `<div class="empty">Tautan ruang rehat belum dipasang. Isi <b>rehat</b> di PENGATURAN.</div>`}
        </div>
      </aside>
    </div></div>`;
}

/* ---------- Render & event ---------- */
function render() {
  const views = { beranda: vBeranda, agenda: vAgenda, sesi: vSesi, live: vLive };
  $app.innerHTML = (views[S.screen] || vBeranda)();
  const navKey = S.screen === 'sesi' ? 'agenda' : S.screen;
  document.querySelectorAll('.tnav [data-nav], .bnav [data-nav]').forEach((b) => {
    if (b.dataset.nav === navKey) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button,[data-nav]'); if (!b || b.getAttribute('aria-disabled') === 'true') return;
  const ds = b.dataset;
  if (ds.nav) return go(ds.nav);
  if (ds.sesi) { const [d, i] = ds.sesi.split('-').map(Number); return go('sesi', { day: d, slot: i }); }
  if (ds.day) return go('agenda', { day: +ds.day });
  if (ds.pickday) return go('agenda', { day: +ds.pickday, slot: 0 });
  if (ds.live) return go('live', { room: +ds.live });
  if (ds.room) return go('live', { room: +ds.room });
  if (ds.liveday) return go('live', { day: +ds.liveday });
  if (ds.rehat) return go('live', { tab: 'rehat' });
  if (ds.step) return go('sesi', { slot: Math.min(3, Math.max(0, S.slot + +ds.step)) });
  if (ds.save) {
    saved[ds.save] = !saved[ds.save]; persist();
    document.querySelectorAll(`[data-save="${ds.save}"]`).forEach((x) => { x.setAttribute('aria-pressed', !!saved[ds.save]); x.textContent = saved[ds.save] ? '★ Tersimpan' : '☆ Simpan'; });
    return;
  }
  if (ds.tab) {
    S.tab = ds.tab;
    document.querySelectorAll('[role="tab"]').forEach((t) => t.setAttribute('aria-selected', t.dataset.tab === S.tab));
    document.querySelectorAll('[role="tabpanel"]').forEach((p) => p.classList.toggle('hidden', p.id !== 'pn-' + S.tab));
  }
});

/* Hitung mundur tiap detik; status sesi diperbarui tiap menit (kecuali di Ruang Live agar video/form tidak termuat ulang) */
setInterval(() => { const w = document.getElementById('cdwrap'); if (w) w.innerHTML = vCountdown(); }, 1000);
setInterval(() => { if (S.screen !== 'live') { const y = window.scrollY; render(); window.scrollTo({ top: y }); } }, 60000);

window.addEventListener('hashchange', () => { fromHash(); render(); });
fromHash(); render();
</script>
</body>
</html>
